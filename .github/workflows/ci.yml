name: ProjeCRM Kalite Kontrolleri

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Tip Kontrolü, Kod Kalitesi ve Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - name: Depoyu hazırla
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} ortamını hazırla
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Kök paketleri doğrula
        run: npm ci --no-audit --no-fund

      - name: Backend paketlerini doğrula
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Frontend paketlerini doğrula
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Backend tip kontrolü
        working-directory: backend
        run: npx tsc --noEmit

      - name: Frontend tip kontrolü
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Kod kalitesi kontrolü
        run: npm run lint
        continue-on-error: true

      - name: Biçim standardı kontrolü
        run: npm run format:check
        continue-on-error: true

      - name: Frontend üretim build'i
        working-directory: frontend
        run: npm run build

      - name: Backend üretim build'i
        working-directory: backend
        run: npx tsc -p tsconfig.json
